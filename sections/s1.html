<div class="section-header"><div class="index">01</div><h2>memory 的本质是什么</h2></div>
          <p>OpenClaw 里的 memory 不是隐藏在模型内部的“神秘长期记忆”。它的本质非常工程化：</p>
          <div class="flow">
            <div class="flow-step" data-step="1">把重要信息写到磁盘文件。</div>
            <div class="flow-step" data-step="2">把文件切成可检索的 chunks。</div>
            <div class="flow-step" data-step="3">建立全文索引与语义索引。</div>
            <div class="flow-step" data-step="4">通过 <code class="inline">memory_search</code> / <code class="inline">memory_get</code> 再把需要的内容取回来。</div>
          </div>
          <div class="callout">也就是说：<strong>只有真正落盘的东西，才算“被记住”</strong>。</div>
          <div class="refs">参考：<code class="inline">docs/concepts/memory.md:9-11</code></div>
